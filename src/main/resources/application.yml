spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cleanarch
    username: cleanarch
    password: cleanarch
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-change-in-production}
  expiration: 86400000

server:
  port: 8080
